
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFSONA QR PRINT</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #edf3fa;
  text-align: center;
  padding: 20px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  max-width: 400px;
  margin: 40px auto;
}
h1 { color: #17447b; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 15px;
}
button {
  background: #17447b;
  color: white;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="card">
  <h1>AFSONA QR PRINT</h1>
  <p>Scan • Upload • Print</p>
  <p>আপনার PDF ফাইল নির্বাচন করুন</p>
  <input type="file" accept=".pdf,application/pdf">
  <button onclick="alert('Upload server এখনও যুক্ত করা হয়নি')">
    Upload Document
  </button>
  <p>Powered by AFSONA</p>
</div>
</body>
</html>
